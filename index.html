<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="The Mood Detective: a collaborative game to increase emotional intelligence.">
<title>The Mood Detective</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,400;0,500;0,700;0,900;1,300&family=Special+Elite&family=Playfair+Display:wght@900&display=swap">
<style>
/* Layout: orange title band like the printed instructions; below it a game table — clue dice on the left, the current step and pinned detective boards on the right; stacks on phones */
:root{
  --paper:#fbfaf6; --surface:#ffffff; --ink:#22206b; --ink-soft:#45437a; --muted:#6d6b8a; --line:#e4e1d7;
  --orange:#e8834a; --orange-deep:#b9551f; --mood:#fcefea; --mood-edge:#f0c2a8; --mood-slot:#f0b590;
  --mint:#d9f8ea; --mint-edge:#8fd9b6; --mint-slot:#b1f4d1; --blue:#bfe3ee; --yellow:#fbec93; --pin:#e8553f; --ok:#24785a;
  --f-display:"Raleway",system-ui,-apple-system,sans-serif; --f-body:"Raleway",system-ui,-apple-system,sans-serif;
  --f-type:"Special Elite","Courier New",monospace; --f-serif:"Playfair Display",Georgia,serif;
  --r:10px;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* title band */
.band{background:var(--orange);color:#111}
.band .wrap{padding-block:18px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.band h1{margin:0;font-family:var(--f-display);font-weight:900;font-size:clamp(1.6rem,4.5vw,2.6rem);letter-spacing:.01em;line-height:1;text-transform:uppercase}
.band p{margin:6px 0 0;font-weight:700;font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;color:#2a2a2a}
.ghost{background:transparent;border:1.5px solid rgba(0,0,0,.55);border-radius:999px;padding:6px 14px;font-weight:700;font-size:.85rem;cursor:pointer;color:#111}
.ghost:hover{background:rgba(255,255,255,.25)}

/* status */
.status{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:16px 4px}
.stamp{font-family:var(--f-type);font-size:1.05rem;border:2px solid var(--orange-deep);color:var(--orange-deep);padding:2px 10px;border-radius:4px;transform:rotate(-2deg);white-space:nowrap}
.rail{display:flex;gap:6px;flex-wrap:wrap;list-style:none;margin:0;padding:0;min-width:0}
.rail li{font-size:.78rem;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--muted);display:flex;gap:6px;align-items:center}
.rail li b{font-variant-numeric:tabular-nums}
.rail li.done{color:var(--ok);border-color:#bfe6d3}
.rail li.now{background:var(--ink);color:#fff;border-color:var(--ink)}

/* table */
.table{display:grid;grid-template-columns:minmax(220px,280px) minmax(0,1fr);gap:24px;padding-block:16px 48px;align-items:start}
@media (max-width:820px){.table{grid-template-columns:minmax(0,1fr)}}
.clues{display:grid;gap:14px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
@media (max-width:820px){.clues{position:static;grid-template-columns:1fr 1fr}}
.die{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:8px}
.die h3{margin:0;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between}
.face{aspect-ratio:1;max-width:100%;border-radius:12px;overflow:hidden;display:grid;place-items:center;text-align:center;font-weight:700;color:var(--ink-soft);padding:10px;font-size:.9rem}
.face.blue{background:var(--blue)} .face.yellow{background:var(--yellow)}
.face img{width:100%;height:100%;object-fit:cover;display:block}
.face.wait{opacity:.55}
.face.rolling img{animation:shake .12s linear infinite}
@keyframes shake{0%{transform:rotate(-6deg) scale(.94)}50%{transform:rotate(6deg) scale(.97)}100%{transform:rotate(-6deg) scale(.94)}}
.cluename{font-weight:900;text-align:center;min-height:1.5em}

/* buttons */
.btn{border:0;border-radius:999px;padding:11px 20px;font-weight:700;cursor:pointer;background:var(--ink);color:#fff;font-size:.95rem}
.btn:hover{background:#34318f}
.btn[disabled]{background:#c9c7d9;cursor:not-allowed}
.btn.orange{background:var(--orange-deep)} .btn.orange:hover{background:#9c4517}
.btn.quiet{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn.quiet:hover{background:#eeedf6}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:18px}
.hint{font-size:.85rem;color:var(--muted)}
.warn{font-size:.88rem;color:var(--orange-deep);font-weight:700}

/* step panel */
.panel{min-width:0}
.panel h2{margin:0 0 4px;font-family:var(--f-display);font-weight:900;font-size:clamp(1.35rem,3vw,1.75rem);text-wrap:balance}
.panel .lede{margin:0 0 16px;max-width:62ch;color:var(--ink-soft)}
.note{background:var(--surface);border:1px dashed var(--mood-edge);border-radius:var(--r);padding:12px 14px;font-size:.9rem;max-width:62ch;color:var(--ink-soft)}
.note b{color:var(--ink)}

/* detective tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tab{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:700;cursor:pointer;font-size:.9rem;display:flex;gap:6px;align-items:center}
.tab.on{border-color:var(--ink);background:var(--ink);color:#fff}
.tab .tick{color:var(--ok);font-weight:900}
.tab.on .tick{color:#9ff0c8}

/* detective board */
.board{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 14px 18px}
.ransom{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;margin:0 0 14px;font-size:clamp(1.05rem,3vw,1.5rem);line-height:1}
.ransom span{display:inline-block;padding:3px 5px}
.ransom .sp{width:10px;padding:0}
.ransom .r0{background:#ece6d6;font-family:var(--f-serif);color:#111}
.ransom .r1{background:#f0dbd5;font-family:var(--f-type);color:#222}
.ransom .r2{background:#e07a5a;font-family:var(--f-serif);color:#2b2b2b}
.ransom .r3{background:#f4eedc;font-family:var(--f-serif);color:#3e6b36;font-style:italic}
.ransom .r4{background:#9db0d6;font-family:var(--f-display);font-weight:900;color:#2f2f3a}
.ransom .r5{background:#ecc56a;font-family:var(--f-serif);color:#a33b3b}
.ransom span:nth-child(3n){transform:rotate(-4deg)} .ransom span:nth-child(4n){transform:rotate(3deg)}
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.col{display:grid;gap:12px;grid-template-rows:auto auto;border-radius:10px;padding:4px;border:2px solid transparent;background:none;text-align:left;cursor:default}
.col.pickable{cursor:pointer}
.col.active{border-color:var(--ink)}
.slot{position:relative;border-radius:4px;padding:16px 10px 10px;min-height:92px;font-size:.85rem;display:grid;align-content:center;gap:4px}
.slot::before{content:"";position:absolute;top:-7px;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--pin);box-shadow:inset -3px -3px 0 rgba(0,0,0,.18)}
.slot.cope{background:var(--mint-slot)} .slot.mood{background:var(--mood-slot)}
.slot .lbl{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;opacity:.65;font-weight:700}
.slot .val{font-weight:900;font-size:1.02rem;overflow-wrap:anywhere}
.slot ul{margin:0;padding-left:16px;font-weight:600;font-size:.82rem}
.slot ul li{overflow-wrap:anywhere}
.slot.empty .val{font-weight:500;opacity:.55;font-size:.85rem}
.mode-mood .slot.cope{opacity:.45}
.x{position:absolute;top:4px;right:4px;border:0;background:rgba(255,255,255,.6);width:24px;height:24px;border-radius:50%;cursor:pointer;font-weight:900;line-height:1;color:var(--ink)}

/* decks */
.deck-h{margin:22px 0 10px;font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700}
.deck{display:grid;gap:10px}
.deck.moods{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.deck.coping{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.card{position:relative;border-radius:6px;padding:14px 12px 14px 40px;cursor:pointer;text-align:left;min-height:68px;display:flex;flex-direction:column;justify-content:center;gap:2px;transition:transform .12s ease,box-shadow .12s ease}
.card:hover{transform:translateY(-2px);box-shadow:0 4px 10px rgba(34,32,107,.10)}
.card .burst{position:absolute;left:4px;top:50%;width:32px;height:32px;margin-top:-16px;color:var(--orange)}
.card.mood{background:var(--mood);border:1.5px solid var(--mood-edge);font-weight:900;font-size:1.05rem}
.card.cope{background:var(--mint);border:1.5px solid var(--mint-edge);font-size:.9rem;font-weight:500}
.card.cope .ct{font-weight:900;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase}
.card.sel{outline:3px solid var(--ink);outline-offset:-1px}
.card.sel::after{content:"✓";position:absolute;top:6px;right:8px;font-weight:900;color:var(--ink)}
.card.blank{border-style:dashed;cursor:default}
.card.blank:hover{transform:none;box-shadow:none}
.card.blank input{width:100%;min-width:0;border:1px solid var(--mint-edge);border-radius:6px;padding:6px 8px;font:inherit;background:#fff;color:var(--ink)}
.card.blank .row{display:flex;gap:6px;margin-top:6px}
.mini{border:0;background:var(--ink);color:#fff;border-radius:6px;padding:5px 10px;font-weight:700;font-size:.8rem;cursor:pointer}
.edit{border:0;background:none;color:var(--ink-soft);text-decoration:underline;font-size:.75rem;cursor:pointer;padding:0;align-self:flex-start}

/* share summaries */
.share{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.who{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.who h4{margin:0 0 8px;font-family:var(--f-type);font-weight:400;font-size:1.05rem}
.pair{display:grid;gap:4px;margin-bottom:8px}
.chip{display:inline-block;padding:2px 10px;border-radius:4px;font-weight:900;font-size:.88rem;background:var(--mood-slot)}
.chip.c{background:var(--mint);font-weight:600;font-size:.82rem}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* case file */
.files{display:grid;gap:20px;grid-template-columns:repeat(auto-fill,minmax(min(100%,460px),1fr))}
.file{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:20px 18px;position:relative;min-width:0}
.file::before{content:"";position:absolute;top:-10px;left:22px;width:14px;height:44px;border:3px solid #8fe0bd;border-radius:10px}
.file h3{margin:0 0 4px 30px;font-family:var(--f-display);font-weight:300;font-style:italic;font-size:2rem;letter-spacing:.12em}
.file .dn{margin:0 0 12px;font-size:.9rem}
.file .dn span{font-family:var(--f-type);font-size:1.1rem;border-bottom:1.5px solid var(--ink);padding:0 8px}
.scroll{overflow-x:auto}
table{border-collapse:separate;border-spacing:3px;width:100%;font-size:.78rem;font-variant-numeric:tabular-nums}
th{font-weight:700;background:#e8f4f6;padding:4px;text-align:center;line-height:1.15}
th:first-child{text-align:left;background:none;font-size:.9rem}
td{background:#f5f5f2;text-align:center;padding:4px;min-width:28px;height:26px}
td:first-child{background:var(--mint);text-align:left;font-weight:600;min-width:170px;padding-left:8px}
td.chk{color:var(--ok);font-weight:900}
td.tot{font-weight:900}
.top3{margin:14px 0 0;padding-left:22px;display:grid;gap:4px}
.top3 li span{font-family:var(--f-type);border-bottom:1.5px solid var(--ink);display:inline-block;min-width:200px;padding:0 4px}

/* setup */
.setup{display:grid;gap:22px;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);padding-block:26px 48px}
@media (max-width:820px){.setup{grid-template-columns:minmax(0,1fr)}}
.facts{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 18px;padding:0;list-style:none}
.facts li{font-weight:900;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:.88rem}
.names{display:grid;gap:10px;max-width:420px}
.names label{display:grid;gap:4px;font-size:.82rem;font-weight:700;color:var(--ink-soft)}
.names input{border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;font:inherit;font-size:1rem;background:var(--surface);color:var(--ink);font-family:var(--f-type)}
.steps-list{margin:0;padding-left:20px;display:grid;gap:6px;font-size:.93rem;color:var(--ink-soft)}
.steps-list b{color:var(--ink)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#fff3;border-radius:8px}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:0 0 18px;max-width:560px}
.mode{display:grid;gap:4px;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer}
.mode b{font-weight:900;font-size:1rem}
.mode span{font-size:.84rem;color:var(--muted)}
.mode.on{border-color:var(--ink);background:#f1f0fa}
.codebox{display:grid;gap:4px;justify-items:start;background:var(--surface);border:2px dashed var(--orange);border-radius:12px;padding:14px 16px;margin:0 0 14px;max-width:420px}
.code{font-family:var(--f-type);font-size:2.4rem;letter-spacing:.18em;line-height:1.1;color:var(--ink)}
.names input.codein{text-transform:uppercase;letter-spacing:.2em;font-size:1.3rem}
.codechip{font-family:var(--f-type);font-size:.95rem;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:2px 10px;white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>

const CASES = 6;

let S; let ui = {msg:'', editing:{}, confirm:false, rolling:false, setup:'table', newCode:''};
const ABC = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
const newCode = () => Array.from({length:5},()=>ABC[Math.floor(Math.random()*ABC.length)]).join('');
function seeded(code){
  let h = 2166136261; for(const c of code){ h ^= c.charCodeAt(0); h = Math.imul(h,16777619); }
  let a = h>>>0; const rnd = () => { a = (a + 0x6D2B79F5)>>>0; let t = a; t = Math.imul(t ^ t>>>15, t|1); t ^= t + Math.imul(t ^ t>>>7, t|61); return ((t ^ t>>>14)>>>0)/4294967296; };
  const blue=[], yellow=[]; for(let i=0;i<CASES;i++){ blue.push(Math.floor(rnd()*6)); yellow.push(Math.floor(rnd()*6)); }
  return {blue, yellow};
}
const phone = () => S.mode==='phone';

function fresh(players){
  return {phase: players ? 'play' : 'setup', players: players || [], caseNo:1, step:0, blue:null, yellow:null, active:0, slot:0,
    boards: (players||[]).map(()=>[]), history:(players||[]).map(()=>Array(CASES).fill(null))};
}
function load(){ try{ const s = JSON.parse(localStorage.getItem(KEY)); if(s && s.phase) return s; }catch(e){} return null; }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const BURST = (()=>{ let l=''; for(let i=0;i<9;i++){ const a=(110+i*17.5)*Math.PI/180, r1=i%2?10:7, r2=i%2?15:19;
  l+=`<line x1="${(32+Math.cos(a)*r1).toFixed(1)}" y1="${(20-Math.sin(a)*r1).toFixed(1)}" x2="${(32+Math.cos(a)*r2*1.5).toFixed(1)}" y2="${(20-Math.sin(a)*r2*1.5).toFixed(1)}"/>`; }
  return `<svg class="burst" viewBox="0 0 40 40" aria-hidden="true"><g stroke="currentColor" stroke-width="1.3" stroke-linecap="round" fill="none">${l}</g></svg>`; })();
function ransom(str){ let i=0; return `<div class="ransom" aria-label="${esc(str)}">${[...str].map(ch => ch===' ' ? '<span class="sp"></span>' : `<span class="r${(i++)%6}" aria-hidden="true">${esc(ch)}</span>`).join('')}</div>`; }

function copingText(p, id, short){
  if(id[0]==='x'){ return S.players[p].custom[+id[1]] || 'Your own idea'; }
  const c = COPING.find(c=>c.id===id); return short ? c.short : c.text;
}

  document.getElementById('restartBox').innerHTML = S.phase==='setup' ? '' : ui.confirm

    : `<button class="ghost" data-a="restart">Start over</button>`;

}

      <ul class="facts"><li>Ages 12+</li><li>30+ minutes</li><li>2–4 detectives</li><li>6 cases</li></ul>
      <h2 style="margin:0 0 10px;font-weight:900;font-size:1.6rem">Who's on the case?</h2>
      ${choice}${form}
    </section>
    <section style="display:grid;gap:16px;align-content:start">
      <div class="note"><b>Detective rule:</b> As detectives, we talk about Moods, Experiences, and Coping Skills. We never refer to personal events or traumas. Those are best discussed with a skilled adult.</div>
      <div>
        <div class="deck-h" style="margin-top:0">Each case</div>
        <ol class="steps-list">
          <li><b>Roll the blue die</b> for the first body clue.</li>
          <li><b>Match 1–3 Mood Cards</b> to the clue on your board.</li>
          <li><b>Share &amp; discuss</b> the moods you chose.</li>
          <li><b>Roll the yellow die.</b> With both clues, keep or change your moods.</li>
          <li><b>Pick 1–3 Coping Cards</b> for each mood. You can write two of your own.</li>
          <li><b>Share again</b> how you'd use those coping skills.</li>
          <li>Your coping cards are <b>checked off on your Case File</b> automatically.</li>
        </ol>
      </div>
      <p class="hint" style="margin:0">After six cases, each detective's Case File shows their top 3 coping skills.</p>
    </section>
  </div>`;
}

function dieBox(kind){
  const isBlue = kind==='blue', v = S[kind], names = isBlue?BLUE:YELLOW, off = isBlue?0:6;
  const locked = !isBlue && S.step < 3;
  const canRoll = (isBlue && S.step===0) || (!isBlue && S.step===3 && S.yellow===null);
  return `<div class="die">
    <h3><span>${isBlue?'1st · Blue die':'2nd · Yellow die'}</span><span>${locked?'Locked':''}</span></h3>
    <div class="face ${kind} ${v===null?'wait':''}" id="face-${kind}">${v===null
      ? (locked?'Unlocks after sharing':'Ready to roll')
      : `<img src="${FACES[off+v]}" alt="Clue: ${esc(names[v])}">`}</div>
    <div class="cluename">${v===null?'':esc(names[v])}</div>
    ${canRoll?`<button class="btn ${isBlue?'':'orange'}" data-a="roll-${kind}" ${ui.rolling?'disabled':''}>Roll ${isBlue?'blue':'yellow'}</button>`:''}
  </div>`;
}

function renderPlay(){
  const rail = STEPS.map((s,i)=>`<li class="${i<S.step?'done':i===S.step?'now':''}"><b>${i+1}</b>${s}</li>`).join('');
  return `<div class="status"><span class="stamp">Case #${S.caseNo} of ${CASES}</span>${phone()?`<span class="codechip">Game ${esc(S.code)}</span>`:''}<ol class="rail" aria-label="Case steps">${rail}</ol></div>
  <div class="table">
    <aside class="clues" aria-label="Clue dice">${dieBox('blue')}${dieBox('yellow')}</aside>
    <section class="panel">${stepPanel()}</section>
  </div>`;
}

function tabs(check){
  if(S.players.length===1) return '';
  return `<div class="tabs" role="tablist">${S.players.map((p,i)=>`<button class="tab ${i===S.active?'on':''}" role="tab" aria-selected="${i===S.active}" data-a="tab" data-i="${i}">${esc(p.name)}${check(i)?'<span class="tick">✓</span>':''}</button>`).join('')}</div>`;
}

function board(p, mode){
  const b = S.boards[p];
  const cols = [0,1,2].map(i=>{
    const m = b[i];
    const pick = mode==='coping' && m;
    const cope = m && m.coping.length
      ? `<span class="lbl">Coping</span><ul>${m.coping.map(id=>`<li>${esc(copingText(p,id,true))}</li>`).join('')}</ul>`
      : `<span class="lbl">Coping Card</span><span class="val" style="opacity:.5;font-weight:500;font-size:.85rem">${mode==='coping'&&m?'Tap a teal card':'—'}</span>`;
    const mood = m
      ? `<span class="lbl">Mood</span><span class="val">${esc(m.mood)}</span>${mode==='mood'?`<button class="x" data-a="unmood" data-i="${i}" aria-label="Remove ${esc(m.mood)}">×</button>`:''}`
      : `<span class="lbl">Mood Card</span><span class="val">Empty</span>`;
    const tag = pick ? 'button' : 'div';
    return `<${tag} class="col ${pick?'pickable':''} ${pick && S.slot===i?'active':''}" ${pick?`data-a="slot" data-i="${i}" aria-label="Pick coping cards for ${esc(m.mood)}"`:''}>
      <div class="slot cope ${m&&m.coping.length?'':'empty'}">${cope}</div>
      <div class="slot mood ${m?'':'empty'}">${mood}</div></${tag}>`;
  }).join('');
  return `<div class="board mode-${mode}">${ransom(S.players[p].name+"'s board")}<div class="slots">${cols}</div></div>`;
}

function moodDeck(p){
  const chosen = S.boards[p].map(m=>m.mood);
  return `<div class="deck-h">Mood Cards · pick 1–3</div><div class="deck moods">${MOODS.map(m=>
    `<button class="card mood ${chosen.includes(m)?'sel':''}" data-a="mood" data-m="${m}" aria-pressed="${chosen.includes(m)}">${BURST}${m}</button>`).join('')}</div>`;
}

function copingDeck(p){
  const m = S.boards[p][S.slot]; const inSlot = m ? m.coping : [];
  const builtIn = COPING.map(c=>`<button class="card cope ${inSlot.includes(c.id)?'sel':''}" data-a="cope" data-id="${c.id}" aria-pressed="${inSlot.includes(c.id)}">${BURST}<span class="ct">Coping Card</span>${esc(c.text)}</button>`).join('');
  const custom = [0,1].map(k=>{
    const t = S.players[p].custom[k], id='x'+k, key=p+'-'+k;
    if(t && !ui.editing[key]) return `<div class="card cope ${inSlot.includes(id)?'sel':''}" style="cursor:pointer" data-a="cope" data-id="${id}" role="button" tabindex="0" aria-pressed="${inSlot.includes(id)}">${BURST}<span class="ct">My Coping Card</span>${esc(t)}<button class="edit" data-a="edit" data-k="${k}">Edit</button></div>`;
    return `<div class="card cope blank">${BURST}<span class="ct">Write your own</span>
      <label class="hint" for="cust-${key}" style="font-size:.78rem">A coping idea that works for you</label>
      <div class="row"><input id="cust-${key}" maxlength="60" value="${esc(t||'')}" placeholder="e.g. Pet my dog"><button class="mini" data-a="savecustom" data-k="${k}">Save</button></div></div>`;
  }).join('');
  return `<div class="deck-h">Coping Cards for <span style="color:var(--ink)">${m?esc(m.mood):'…'}</span> · pick 1–3</div><div class="deck coping">${builtIn}${custom}</div>`;
}

const moodsOk = i => S.boards[i].length>0;
const copingOk = i => S.boards[i].length>0 && S.boards[i].every(m=>m.coping.length>0);

function stepPanel(){
  const p = S.active, msg = ui.msg ? `<span class="warn">${esc(ui.msg)}</span>` : '';
  const back = S.step>0 && S.step<6 ? `<button class="btn quiet" data-a="back">Back</button>` : '';
  switch(S.step){
    case 0: return `<h2>${esc(roller())}, roll the blue die</h2>
      <p class="lede">${phone()?`Every case has two body clues. Everyone playing game ${esc(S.code)} gets the same clue, so roll together.`:'Every case has two body clues. The blue die gives the first one. Put the screen in the middle so every detective can see it.'}</p>
      <div class="note"><b>Remember:</b> We talk about Moods, Experiences, and Coping Skills, not personal events or traumas.</div>
      <div class="actions"><button class="btn" data-a="roll-blue" ${ui.rolling?'disabled':''}>Roll blue die</button></div>`;
    case 1: return `<h2>Match moods to the clue: ${esc(BLUE[S.blue])}</h2>
      <p class="lede">Each detective picks 1–3 Mood Cards that fit this clue. Tap your name, choose your moods, then pass the screen.</p>
      <p class="hint" style="margin:-8px 0 14px;max-width:62ch"><i>Example: if the clue is “Headache,” Detective Caroline might choose Angry because she remembers getting a headache when she felt angry about sharing the swings with her brother.</i></p>
      ${tabs(moodsOk)}${board(p,'mood')}${moodDeck(p)}
      <div class="actions">${back}${nextFor(p, moodsOk, 'Everyone has moods. Share!')}${msg}</div>`;
    case 2: return `<h2>Share &amp; discuss</h2>
      <p class="lede">Go around the table. Each detective shows their Mood Cards and explains why that mood fits “${esc(BLUE[S.blue])}.” Did anyone pick the same mood? Did anyone pick a surprising one?</p>
      ${shareGrid(false)}
      <div class="actions">${back}<button class="btn orange" data-a="next">${phone()?'Roll the yellow die':esc(roller())+' rolls the yellow die'}</button></div>`;
    case 3:
      if(S.yellow===null) return `<h2>${esc(roller())}, roll the yellow die</h2>
        <p class="lede">The second clue might change the picture. Roll to reveal it.</p>
        <div class="actions">${back}<button class="btn orange" data-a="roll-yellow" ${ui.rolling?'disabled':''}>Roll yellow die</button></div>`;
      return `<h2>${esc(BLUE[S.blue])} + ${esc(YELLOW[S.yellow])}</h2>
        <p class="lede">With both clues, would your mood be the same or different? If it's different, swap your Mood Cards. If it's the same, keep them.</p>
        ${tabs(moodsOk)}${board(p,'mood')}${moodDeck(p)}
        <div class="actions">${back}${nextFor(p, moodsOk, 'Moods are set. Pick coping cards')}${msg}</div>`;
    case 4: if(!S.boards[p][S.slot]) S.slot = 0;
      return `<h2>Select coping cards</h2>
      <p class="lede">For each mood on your board, pick 1–3 Coping Cards that could help. Tap a mood column on your board, then tap cards. Blank cards let you write your own ideas.</p>
      ${tabs(copingOk)}${board(p,'coping')}${copingDeck(p)}
      <div class="actions">${back}${nextFor(p, copingOk, 'Everyone has coping cards. Share again')}${msg}</div>`;
    case 5: return `<h2>Share again</h2>
      <p class="lede">Each detective shares the coping strategies they'd use to manage each mood. Has anyone tried one of these before? Which would be easiest to use at school or at home?</p>
      ${shareGrid(true)}
      <div class="actions">${back}<button class="btn orange" data-a="close">Close the case</button></div>`;
    case 6: { const last = S.caseNo===CASES;
      return `<h2>Case #${S.caseNo} closed</h2>
      <p class="lede">${phone()?'These coping cards were checked off on your Case File for this round. Wait for the other detectives before starting the next case.':"These coping cards were checked off on each detective's Case File for this round."}</p>
      <div class="share">${S.players.map((pl,i)=>`<div class="who"><h4>Detective ${esc(pl.name)}</h4><div class="chips">${(S.history[i][S.caseNo-1]||[]).map(id=>`<span class="chip c">✓ ${esc(copingText(i,id,true))}</span>`).join('')}</div></div>`).join('')}</div>
      <div class="actions">${last
        ? `<button class="btn orange" data-a="finish">Open the Case Files</button>`
        : `<button class="btn orange" data-a="nextcase">Start Case #${S.caseNo+1}${phone()?'':': '+esc(S.players[S.caseNo % S.players.length].name)+' rolls'}</button>`}
        <span class="hint">Case ${S.caseNo} of ${CASES}</span></div>`; }
  }
}

function nextFor(p, ok, label){
  const allOk = S.players.every((_,i)=>ok(i));
  if(allOk) return `<button class="btn orange" data-a="next">${label}</button>`;
  const nextP = S.players.findIndex((_,i)=>i!==p && !ok(i));
  if(ok(p) && nextP>=0) return `<button class="btn" data-a="tab" data-i="${nextP}">Pass to ${esc(S.players[nextP].name)}</button>`;
  return `<button class="btn" disabled>${label}</button><span class="hint">Waiting on ${S.players.filter((_,i)=>!ok(i)).map(x=>esc(x.name)).join(', ')}</span>`;
}

function shareGrid(withCoping){
  return `<div class="share">${S.players.map((pl,i)=>`<div class="who"><h4>Detective ${esc(pl.name)}</h4>${S.boards[i].map(m=>`<div class="pair"><div><span class="chip">${esc(m.mood)}</span></div>${withCoping?`<div class="chips">${m.coping.map(id=>`<span class="chip c">${esc(copingText(i,id,true))}</span>`).join('')}</div>`:''}</div>`).join('')}</div>`).join('')}</div>`;
}

function renderEnd(){
  return `<div class="status"><span class="stamp">All ${CASES} cases solved</span></div>
  <h2 style="font-weight:900;font-size:1.7rem;margin:10px 0 4px">Case Files</h2>
  <p class="lede" style="color:var(--ink-soft);max-width:62ch;margin:0 0 22px">${phone()?'Share your top 3 coping skills with the other detectives. ':''}Each detective shares their top 3 coping skills: the cards they reached for most. Number 4 is always the same, because a trusted adult can help with any mood.</p>
  <div class="files">${S.players.map((pl,i)=>caseFile(i)).join('')}</div>
  <div class="actions" style="margin-bottom:48px">${phone()?'<button class="btn orange" data-a="again">Start a new game</button>':'<button class="btn orange" data-a="again">Play again, same detectives</button><button class="btn quiet" data-a="restart-yes">New detectives</button>'}</div>`;
}

function caseFile(i){
  const H = S.history[i];
  const rows = [...COPING.map(c=>c.id),'x0','x1'];
  const tot = id => H.reduce((n,r)=>n+(r&&r.includes(id)?1:0),0);
  const body = rows.map(id=>{
    const name = id[0]==='x' ? (S.players[i].custom[+id[1]]||'') : copingText(i,id,true);
    return `<tr><td>${esc(name)}</td>${H.map(r=>`<td class="chk">${r&&r.includes(id)?'✓':''}</td>`).join('')}<td class="tot">${name?tot(id):''}</td></tr>`;
  }).join('');
  const top = rows.filter(id=>id!=='c4' && tot(id)>0).sort((a,b)=>tot(b)-tot(a)).slice(0,3);
  return `<article class="file"><h3>Case File</h3>
    <p class="dn">Detective Name: <span>${esc(S.players[i].name)}</span></p>
    <div class="scroll"><table><thead><tr><th>Coping Skills</th>${H.map((_,k)=>`<th>Round<br>${k+1}</th>`).join('')}<th>Total</th></tr></thead><tbody>${body}</tbody></table></div>
    <p style="margin:16px 0 0;font-weight:700">Top 3 Coping Skills:</p>
    <ol class="top3">${[0,1,2].map(k=>`<li><span>${top[k]?esc(copingText(i,top[k],true)):'&nbsp;'}</span></li>`).join('')}<li><span>Talk to a Trusted Adult</span></li></ol>
  </article>`;
}

/* ---------- actions ---------- */
function roll(kind){
  if(ui.rolling) return;
  const v = phone() ? seeded(S.code)[kind][S.caseNo-1] : Math.floor(Math.random()*6), off = kind==='blue'?0:6;
  const finish = () => { S[kind]=v; ui.rolling=false; if(kind==='blue'){ S.step=1; S.active=0; } render(); };
  if(reduce){ finish(); return; }
  ui.rolling = true; render();
  const face = document.getElementById('face-'+kind);
  face.classList.remove('wait'); face.classList.add('rolling');
  let t=0; const iv = setInterval(()=>{
    face.innerHTML = `<img src="${FACES[off+Math.floor(Math.random()*6)]}" alt="">`;
    if((t+=90)>=760){ clearInterval(iv); finish(); }
  },90);
}

document.addEventListener('click', e=>{
  const el = e.target.closest('[data-a]'); if(!el) return;
  const a = el.dataset.a; const p = S.active; ui.msg='';
  if(a==='edit'){ e.stopPropagation(); ui.editing[p+'-'+el.dataset.k]=true; render(); return; }
  switch(a){
    case 'begin': {
      const names = [0,1,2,3].map(i=>document.getElementById('p'+i).value.trim()).filter(Boolean);
      if(names.length<2){ ui.msg='Add at least two detectives to start.'; render(); return; }
      S = fresh(names.map(n=>({name:n, custom:['','']}))); break; }
    case 'setup': ui.setup = el.dataset.m; if(ui.setup==='host' && !ui.newCode) ui.newCode = newCode(); break;
    case 'begin-phone': {
      const name = document.getElementById('me').value.trim();
      const code = ui.setup==='host' ? ui.newCode : document.getElementById('joincode').value.toUpperCase().replace(/[^A-Z0-9]/g,'');
      if(ui.setup==='join' && (code.length!==5 || [...code].some(c=>!ABC.includes(c)))){ ui.msg='Check the code. It has 5 letters and numbers.'; render(); return; }
      if(!name){ ui.msg='Add your detective name.'; render(); return; }
      S = fresh([{name, custom:['','']}]); S.mode='phone'; S.code=code; ui.newCode=''; break; }
    case 'restart': ui.confirm=true; break;
    case 'restart-no': ui.confirm=false; break;
    case 'restart-yes': { const names = phone()?[]:S.players; ui.setup = phone()?'host':'table'; ui.newCode = phone()?newCode():''; ui.confirm=false; S = fresh(); S.players = names; S.phase='setup'; break; }
    case 'again':
      if(phone()){ ui.setup='host'; ui.newCode=newCode(); S = fresh(); }
      else S = fresh(S.players.map(pl=>({name:pl.name, custom:pl.custom}))); break;
    case 'roll-blue': roll('blue'); return;
    case 'roll-yellow': roll('yellow'); return;
    case 'tab': S.active = +el.dataset.i; S.slot = 0; break;
    case 'mood': {
      const b = S.boards[p], m = el.dataset.m, i = b.findIndex(x=>x.mood===m);
      if(i>=0) b.splice(i,1); else if(b.length<3) b.push({mood:m, coping:[]}); else ui.msg='Your board holds 3 moods. Remove one with × first.';
      break; }
    case 'unmood': S.boards[p].splice(+el.dataset.i,1); break;
    case 'slot': S.slot = +el.dataset.i; break;
    case 'cope': {
      const m = S.boards[p][S.slot]; if(!m) break;
      const id = el.dataset.id, i = m.coping.indexOf(id);
      if(i>=0) m.coping.splice(i,1); else if(m.coping.length<3) m.coping.push(id); else ui.msg=`${m.mood} already has 3 coping cards. Tap one to remove it.`;
      break; }
    case 'savecustom': {
      const k = +el.dataset.k, v = document.getElementById(`cust-${p}-${k}`).value.trim();
      S.players[p].custom[k] = v; delete ui.editing[p+'-'+k];
      if(!v) S.boards[p].forEach(m=>{ m.coping = m.coping.filter(x=>x!=='x'+k); });
      break; }
    case 'next': S.step++; S.active=0; S.slot=0; break;
    case 'back': S.step--; if(S.step===0) S.blue=null; break;
    case 'close':
      S.players.forEach((_,i)=>{ S.history[i][S.caseNo-1] = [...new Set(S.boards[i].flatMap(m=>m.coping))]; });
      S.step=6; break;
    case 'nextcase': S.caseNo++; S.step=0; S.blue=null; S.yellow=null; S.active=0; S.slot=0; S.boards=S.players.map(()=>[]); break;
    case 'finish': S.phase='end'; break;
  }
  render();
  if(['next','close','nextcase','finish','begin','again','back'].includes(a)) window.scrollTo({top:0,behavior:reduce?'auto':'smooth'});
});
document.addEventListener('keydown', e=>{
  if((e.key==='Enter'||e.key===' ') && e.target.matches('div.card[data-a]')){ e.preventDefault(); e.target.click(); }
  if(e.key==='Enter' && e.target.matches('.card.blank input')){ e.preventDefault(); e.target.parentElement.querySelector('[data-a=savecustom]').click(); }
});

function start(data){ S = (data && data.phase) ? data : (load() || fresh()); if(S.phase==='setup' && ui.setup==='host' && !ui.newCode) ui.newCode=newCode(); render(); }
window.claude?.hot?.snapshot?.(()=>S);
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? null);
</script>

</body>
</html>
